<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Rodolfo module mark, flat gold-glow edition</title>
  <desc id="desc">Transparent CASTOR-family emblem with a flat oxblood R, a faint dark-antique-gold halo, and technical orbital rings.</desc>

  <defs>
    <!-- Flat internal texture only. No bevel, embossing, shading, or metallic volume. -->
    <pattern id="rTexture" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(24)">
      <line x1="0" y1="0" x2="0" y2="18" stroke="#F0C36A" stroke-opacity="0.045" stroke-width="1"/>
      <line x1="7" y1="0" x2="7" y2="18" stroke="#220408" stroke-opacity="0.10" stroke-width="2"/>
    </pattern>

    <!-- A single soft halo. It does not alter the R geometry or create a rounded border. -->
    <filter id="goldHalo" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="7"/>
    </filter>

    <mask id="rMask">
      <rect width="1024" height="1024" fill="black"/>
      <g fill="none" stroke="white" stroke-width="106" stroke-linecap="butt" stroke-linejoin="miter">
        <path d="M340 758V284"/>
        <path d="M340 284H548C655 284 726 340 726 430C726 520 655 576 548 576H340"/>
        <path d="M548 576L724 758"/>
      </g>
    </mask>
  </defs>

  <!-- Transparent canvas: deliberately no background rectangle. -->

  <!-- CASTOR-family technical perimeter. -->
  <circle cx="512" cy="512" r="440" fill="none" stroke="#3F2810" stroke-width="8"/>
  <circle cx="512" cy="512" r="352" fill="none" stroke="#6A4319" stroke-width="10"
          stroke-linecap="butt" stroke-dasharray="14 30"/>

  <!-- Faint dark-gold neon behind the R. This is the only border treatment. -->
  <g fill="none" stroke="#7A5222" stroke-width="116" stroke-linecap="butt" stroke-linejoin="miter"
     opacity="0.58" filter="url(#goldHalo)">
    <path d="M340 758V284"/>
    <path d="M340 284H548C655 284 726 340 726 430C726 520 655 576 548 576H340"/>
    <path d="M548 576L724 758"/>
  </g>

  <!-- Flat oxblood R. -->
  <g fill="none" stroke="#681923" stroke-width="106" stroke-linecap="butt" stroke-linejoin="miter">
    <path d="M340 758V284"/>
    <path d="M340 284H548C655 284 726 340 726 430C726 520 655 576 548 576H340"/>
    <path d="M548 576L724 758"/>
  </g>

  <!-- Extremely restrained vector texture, clipped to the oxblood R. -->
  <rect width="1024" height="1024" fill="url(#rTexture)" mask="url(#rMask)"/>
</svg>
