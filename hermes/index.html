<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020b10">
<title>HERMES · Route & Network Intelligence</title>
<style>html,body{margin:0;min-height:100%;background:#020b10;color:#c4dcdd;font-family:system-ui,sans-serif}.boot{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}.boot b{color:#8af5f4;letter-spacing:.18em}.boot small{display:block;margin-top:10px;color:#86a8aa;max-width:34rem;line-height:1.45}.diag{font-family:ui-monospace,monospace;font-size:12px;text-align:left;white-space:pre-wrap;max-width:90vw;margin-top:18px;color:#d8eeee}</style>
<script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js"></script>
</head>
<body><div class="boot"><div><b>HERMES</b><small>Loading route & network intelligence…</small></div></div>
<script>
(async()=>{
  const files=['payload-00.txt','payload-01.txt','payload-02.txt','payload-03.txt','payload-04.txt','payload-05.txt','payload-06.txt','payload-07.txt','payload-08.txt','payload-09a.txt','payload-09b.txt','payload-10.txt','payload-11.txt','payload-12.txt'];
  try{
    let b64='';
    for(const file of files){
      const r=await fetch(file+'?v=4',{cache:'no-store'});
      if(!r.ok) throw new Error(`${file} HTTP ${r.status}`);
      b64+=(await r.text()).trim();
    }
    const raw=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    let bytes;
    if(window.fflate?.gunzipSync){
      bytes=window.fflate.gunzipSync(raw);
    }else if('DecompressionStream' in window){
      const stream=new Blob([raw]).stream().pipeThrough(new DecompressionStream('gzip'));
      bytes=new Uint8Array(await new Response(stream).arrayBuffer());
    }else{
      throw new Error('This browser cannot decompress the HERMES publication package.');
    }
    let html=new TextDecoder('utf-8').decode(bytes);
    const bootPatch=`<script>
(function(){
  const show=(label,detail)=>{document.body.innerHTML='<div class="boot"><div><b>HERMES</b><small>'+label+'</small><div class="diag">'+String(detail||'').replace(/[<>&]/g,'')+'</div></div></div>'};
  addEventListener('error',e=>show('Runtime error',e.message||e.error||'unknown error'));
  addEventListener('unhandledrejection',e=>show('Runtime promise error',e.reason?.message||e.reason||'unknown rejection'));
  setTimeout(()=>{
    if(!document.querySelector('.app-shell')){
      const g=['HermesDomain','HermesI18n','HermesStorage','HermesState','HermesNavigation','HermesModules','HermesUI'].map(k=>k+': '+(typeof window[k])).join('\\n');
      show('HERMES loaded but did not boot.',g+'\\nreadyState: '+document.readyState);
    }
  },4500);
  setTimeout(()=>document.dispatchEvent(new Event('DOMContentLoaded')),50);
})();
<\/script>`;
    html=html.replace('</body>',bootPatch+'</body>');
    document.open();document.write(html);document.close();
  }catch(err){
    console.error('[HERMES publication]',err);
    document.body.innerHTML='<div class="boot"><div><b>HERMES</b><small>Publication loader failed: '+String(err).replace(/[<>&]/g,'')+'<br><br>The publication itself needs repair. No local setup is required.</small></div></div>';
  }
})();
</script></body></html>
